  projectId: "program-kerja-pengawas-sekolah",
  storageBucket: "program-kerja-pengawas-sekolah.firebasestorage.app",
  messagingSenderId: "202162076726",
  appId: "1:202162076726:web:43045bd123fe29cf23ac97"
};
const ADMIN_EMAIL = "buktikerja.makmurnonci@gmail.com"; // email Google admin (harus sama dengan di firestore.rules)
/* ============================================================== */
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,collection,onSnapshot,serverTimestamp,writeBatch} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const gate=$("gate");
const show=h=>{gate.hidden=false;gate.innerHTML=`<div class="card">${h}</div>`};
const outBtn=`<button class="btn bg" id="lo">Keluar</button>`;
const bindOut=()=>{const b=$("lo");if(b)b.onclick=()=>signOut(auth)};
let unsub=[],booted=false,mode=null; // mode: null | "full" | "preview"

onAuthStateChanged(auth,async u=>{
  unsub.forEach(f=>f());unsub=[];
  if(!u){if(booted){location.reload();return}return login()}
  show("<p>Memuat…</p>");
  try{await enter(u)}catch(e){show(`<h2>Terjadi kesalahan</h2><p class="note">${esc(e.message)}</p>${outBtn}`);bindOut()}
});

function login(msg){
  show(`<h2>Program Kerja Pengawas Sekolah</h2><p class="note">Masuk dengan akun Google Anda.</p>${msg?`<p style="color:var(--c1)">${esc(msg)}</p>`:""}<button class="btn" id="li">Masuk dengan Google</button>`);
  $("li").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>login(e.code=="auth/popup-closed-by-user"?"":e.message));
}

async function enter(u){
  const ref=doc(db,"users",u.uid);
  const s=await getDoc(ref);
  if(!s.exists()){
    const adm=(u.email||"").toLowerCase()==ADMIN_EMAIL.toLowerCase();
    await setDoc(ref,{email:u.email,name:u.displayName||u.email,role:adm?"admin":"pengawas",status:adm?"approved":"pending",createdAt:serverTimestamp(),lastLogin:serverTimestamp()});
  }
  unsub.push(onSnapshot(ref,snap=>{
    const me=snap.data();if(!me)return;
    const want=me.status=="approved"?"full":me.status=="pending"?"preview":null;
    if(mode){if(mode!==want)location.reload();return}
    if(want=="full")boot(u,me);
    else if(want=="preview")preview(u,me);
    else blocked(u,me);
  }));
}

function blocked(u,me){
  if(me.status=="cancelled"){
    show(`<h2>Permintaan dibatalkan</h2><p class="note">Anda membatalkan permintaan akses untuk ${esc(u.email)}. Anda dapat mengajukannya kembali; permintaan harus disetujui admin.</p><p><button class="btn" id="rq">Ajukan Akses Kembali</button> ${outBtn}</p>`);
    $("rq").onclick=()=>updateDoc(doc(db,"users",u.uid),{status:"pending",requestedAt:serverTimestamp()}).catch(e=>alert(e.message));
  }else if(me.status=="deleted"){
    show(`<h2>Akun dihapus</h2><p class="note">Akun ${esc(u.email)} telah dihapus oleh admin. Anda dapat mengajukan akses kembali; permintaan harus disetujui admin.</p><p><button class="btn" id="rq">Ajukan Akses Kembali</button> ${outBtn}</p>`);
    $("rq").onclick=()=>updateDoc(doc(db,"users",u.uid),{status:"pending",requestedAt:serverTimestamp()}).catch(e=>alert(e.message));
  }else if(me.status=="pending"){
    show(`<h2>Menunggu persetujuan</h2><p class="note">Permintaan akses untuk ${esc(u.email)} sudah dikirim. Halaman ini akan terbuka otomatis setelah admin menyetujui.</p>${outBtn}`);
  }else{
    show(`<h2>Permintaan ditolak</h2><p class="note">Admin menolak akses untuk ${esc(u.email)}. Hubungi admin bila perlu.</p>${outBtn}`);
  }
  bindOut();
}

/* ===== Pratinjau baca-saja untuk akun yang belum disetujui admin ===== */
const RO_OK=new Set(["th","pm","tm"]); // hanya ganti tema & bulan (tampilan saja)
function lockUI(){
  document.querySelectorAll("#v input,#v textarea,#v select").forEach(el=>{el.disabled=true});
  document.querySelectorAll("#v [data-a],header [data-a]").forEach(b=>{if(!RO_OK.has(b.dataset.a)){b.disabled=true;b.title="Tersedia setelah disetujui admin"}});
  const t=$("ttl");t.contentEditable="false";t.removeAttribute("title");
}
function preview(u,me){
  booted=true;mode="preview";
  window.__RO=true;window.__UD=null;window.__saveHook=null; // tidak membaca/menulis data apa pun
  document.body.classList.add("ro");
  // blokir semua aksi selain navigasi tab, tema, dan pilih bulan
  const guard=e=>{
    const t=e.target;if(!t||!t.closest)return;
    if(e.type=="click"){
      const b=t.closest("[data-t],[data-a]");
      if(!b||b.dataset.t!==undefined||RO_OK.has(b.dataset.a))return;
      e.stopImmediatePropagation();e.preventDefault();return;
    }
    if(e.type=="keydown"&&!t.closest("#v,#ttl"))return;
    if(t.closest("#v input,#v textarea,#v select,#ttl")){e.stopImmediatePropagation();e.preventDefault()}
  };
  ["click","change","input","paste","drop","keydown"].forEach(ev=>window.addEventListener(ev,guard,true));
  const bar=document.createElement("div");bar.id="pvb";
  bar.innerHTML=`<span><b>Mode pratinjau.</b> Akun ${esc(u.email)} menunggu persetujuan admin. Anda dapat membuka semua menu (data contoh), tetapi belum bisa mengedit atau menyimpan.</span> <button class="hb" id="pvc">Batalkan permintaan</button>`;
  document.body.prepend(bar);
  $("pvc").onclick=async()=>{
    if(!confirm("Batalkan permintaan akses? Anda dapat mengajukannya kembali kapan saja."))return;
    try{await updateDoc(doc(db,"users",u.uid),{status:"cancelled",cancelledAt:serverTimestamp()})}catch(e){alert(e.message)}
  };
  new MutationObserver(lockUI).observe($("v"),{childList:true,subtree:true});
  gate.hidden=true;
  const sc=document.createElement("script");sc.textContent=$("app-src").textContent;document.body.appendChild(sc);
  lockUI();
  $("uname").textContent=me.name||u.email;
  $("outbtn").hidden=false;$("outbtn").onclick=()=>signOut(auth);
  document.body.classList.add("in");
}

async function boot(u,me){
  booted=true;mode="full";
  const d=await getDoc(doc(db,"data",u.uid));
  if(d.exists()){try{window.__UD=JSON.parse(d.data().json)}catch(e){}}
  let t;
  window.__saveHook=D=>{clearTimeout(t);t=setTimeout(()=>setDoc(doc(db,"data",u.uid),{json:JSON.stringify(D),updatedAt:serverTimestamp()}).catch(e=>console.error(e)),800)};
  const sc=document.createElement("script");sc.textContent=$("app-src").textContent;document.body.appendChild(sc);
  if(!d.exists())window.__saveHook(D);
  updateDoc(doc(db,"users",u.uid),{lastLogin:serverTimestamp()}).catch(()=>{});
  $("uname").textContent=me.name||u.email;
  $("impbtn").hidden=false;$("impbtn").onclick=()=>importer(u.uid);
  $("outbtn").hidden=false;$("outbtn").onclick=()=>signOut(auth);
  if(me.role=="admin"){
    const ab=$("admbtn");ab.hidden=false;ab.onclick=adminPanel;
    unsub.push(onSnapshot(collection(db,"users"),s=>{const n=s.docs.filter(x=>x.data().status=="pending").length;ab.textContent="Kelola Pengawas"+(n?` (${n} menunggu)`:"")}));
  }
  document.body.classList.add("in");gate.hidden=true;
}

function importer(uid){
  if($("imp"))return;
  const p=document.createElement("div");p.id="imp";
  p.innerHTML=`<div style="max-width:720px;margin:auto"><div class="arow" style="border:0"><h2 style="margin:0">Impor Data Lama</h2><button class="btn bg" id="ix">Tutup</button></div><div class="card"><p class="note">Tempel data yang disalin dari aplikasi lama. Data yang ada sekarang akan diganti.</p><textarea id="itx" rows="8" placeholder="Tempel di sini…"></textarea><p><button class="btn" id="iok">Impor</button></p></div></div>`;
  document.body.appendChild(p);
  $("ix").onclick=()=>p.remove();
  $("iok").onclick=async()=>{
    try{
      let o=JSON.parse($("itx").value.trim());if(typeof o=="string")o=JSON.parse(o);
      if(!o||!o.sk)throw new Error("Data tidak dikenali. Pastikan yang ditempel hasil salinan dari aplikasi lama.");
      if(!confirm("Ganti data saat ini dengan data yang ditempel?"))return;
      window.__saveHook=()=>{};
      await setDoc(doc(db,"data",uid),{json:JSON.stringify(o),updatedAt:serverTimestamp()});
      location.reload();
    }catch(e){alert(e.message)}
  };
}

function adminPanel(){
  if($("adm"))return;
  const p=document.createElement("div");p.id="adm";
  p.innerHTML=`<div style="max-width:820px;margin:auto"><div class="arow" style="border:0"><h2 style="margin:0">Kelola Pengawas</h2><button class="btn bg" id="ax">Tutup</button></div><div id="al"></div></div>`;
  document.body.appendChild(p);
  const bt=(id,op,l,c)=>`<button class="btn ${c||""}" data-id="${id}" data-op="${op}">${l}</button> `;
  const sec=(t,n,list,f)=>`<div class="card"><h3>${t} (${list.length})</h3>${list.length?list.map(x=>`<div class="arow"><div>${esc(x.name)}<br><span class="note">${esc(x.email)}</span></div><div>${f(x)}</div></div>`).join(""):`<p class="empty">${n}</p>`}</div>`;
  const un=onSnapshot(collection(db,"users"),s=>{
    const a=s.docs.map(x=>({id:x.id,...x.data()})),g=k=>a.filter(x=>x.role!="admin"&&x.status==k);
    $("al").innerHTML=
      sec("Menunggu persetujuan","Tidak ada permintaan.",g("pending"),x=>bt(x.id,"ok","Setujui")+bt(x.id,"no","Tolak","bg"))+
      sec("Pengawas aktif","Belum ada pengawas lain.",g("approved"),x=>bt(x.id,"del","Hapus","dn"))+
      sec("Dihapus / ditolak / dibatalkan","Kosong.",a.filter(x=>x.role!="admin"&&(x.status=="deleted"||x.status=="rejected"||x.status=="cancelled")),x=>`<span class="note">${x.status=="deleted"?"Dihapus":x.status=="cancelled"?"Dibatalkan":"Ditolak"}</span> `+bt(x.id,"ok","Pulihkan","bg"));
  });
  p.addEventListener("click",async e=>{
    const b=e.target.closest("[data-op]");
    if(e.target.id=="ax"){un();p.remove();return}
    if(!b)return;
    const id=b.dataset.id,op=b.dataset.op,ref=doc(db,"users",id);
    try{
      if(op=="ok")await updateDoc(ref,{status:"approved"});
      else if(op=="no")await updateDoc(ref,{status:"rejected"});
      else if(op=="del"){
        if(!confirm("Hapus akun pengawas ini beserta seluruh datanya? Untuk masuk lagi, ia harus meminta persetujuan Anda."))return;
        const w=writeBatch(db);w.update(ref,{status:"deleted"});w.delete(doc(db,"data",id));await w.commit();
      }
    }catch(err){alert(err.message)}
  });
}
</script>
</body>
</html>
