  }

    if(mode){if(mode!==want)location.reload();return}
    if(want=="full")boot(u,me);
    else if(want=="preview")preview(u,me);

  }));
}

    if(e.target.id=="ax"){un();p.remove();return}
    if(!b)return;
    const id=b.dataset.id,op=b.dataset.op,ref=doc(db,"users",id);
    try{
      if(op=="ok")await updateDoc(ref,{status:"approved"});
      else if(op=="no")await updateDoc(ref,{status:"rejected"});
      else if(op=="rm"){
        if(!confirm("Hapus permanen catatan akun ini dari daftar? Jika ia login lagi, akan masuk sebagai permintaan baru yang harus Anda setujui."))return;
        const w=writeBatch(db);w.delete(ref);w.delete(doc(db,"data",id));await w.commit();
      }
      else if(op=="del"){
        if(!confirm("Hapus akun pengawas ini beserta seluruh datanya? Untuk masuk lagi, ia harus meminta persetujuan Anda."))return;
        const w=writeBatch(db);w.update(ref,{status:"deleted"});w.delete(doc(db,"data",id));await w.commit();
      }
    }catch(err){alert(err.message)}
  });
}
</script>
</body>
</html>
